<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADUSHANKA MD - Pairing Portal</title>
    <link rel="icon" href="https://i.ibb.co/PGHm7zDW/file-00000000a29c8211a77f81f71cbcdf06.png">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #05000a;
            background-image:
                linear-gradient(180deg, rgba(5,0,2,0.55) 0%, rgba(5,0,2,0.75) 55%, rgba(5,0,2,0.95) 100%),
                url('https://i.ibb.co/xKGN4Mbt/file-00000000abbc8209a1710f6f9dbd38fe.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f5e6e6;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 0;
            overflow-x: hidden;
        }
        .card {
            position: relative;
            background: rgba(8, 2, 4, 0.82);
            backdrop-filter: blur(10px);
            padding: 40px 30px 30px 30px;
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.85), 0 0 60px rgba(220,20,20,0.25);
            width: 100%;
            max-width: 460px;
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
            text-align: center;
            border: none;
            border-left: 1px solid rgba(220,20,20,0.3);
            border-right: 1px solid rgba(220,20,20,0.3);
        }
        @media (min-width: 500px) {
            .card { min-height: auto; border-radius: 22px; margin: 20px; }
        }
        .logo-wrap {
            position: relative;
            width: 100%; max-width: 320px; margin: 0 auto 18px auto;
            border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(220,20,20,0.45);
            box-shadow: 0 0 30px rgba(220,20,20,0.35);
        }
        .logo-wrap img { width: 100%; display: block; }
        h2 { display: none; }
        .badge {
            display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #0a0000;
            background: linear-gradient(135deg,#ff2b2b,#8a0303);
            padding: 4px 12px; border-radius: 20px; font-weight: bold; margin-bottom: 18px; letter-spacing: 0.5px;
            color: #fff;
        }
        .badge svg { width: 12px; height: 12px; flex-shrink: 0; }
        p { color: #d9b9b9; font-size: 14px; margin-bottom: 20px; }
        #result { margin-top: 20px; font-size: 15px; word-break: break-all; font-weight: bold; min-height: 20px; }
        #result .hint { display: block; font-size: 12px; color: #d9b9b9; font-weight: normal; margin-top: 10px; }
        #result .err { display: inline-flex; align-items: center; gap: 6px; color: #ff5757; }
        #result .err svg { width: 16px; height: 16px; flex-shrink: 0; }
        .footer { margin-top: 22px; font-size: 11px; color: #8a6a6a; }
        .status-line { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #d9b9b9; margin-top: 16px; }
        .status-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #64748b;
        }
        .status-dot.online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        .status-dot.offline { background: #ff5757; box-shadow: 0 0 8px #ff5757; }
        #qrBox {
            width: 100%; max-width: 260px; aspect-ratio: 1 / 1; margin: 10px auto 0 auto; background: #fff;
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid rgba(220,20,20,0.5);
            box-shadow: 0 0 30px rgba(220,20,20,0.3);
        }
        #qrImg { width: 100%; height: 100%; object-fit: contain; }
        #qrLoading { color: #1c0000; font-size: 13px; font-weight: bold; }

        /* ---- Animations ---- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(220,20,20,0.35); }
            50% { box-shadow: 0 0 55px rgba(255,40,40,0.6); }
        }
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }
        @keyframes scanLine {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes petalFall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.7; }
            100% { transform: translateY(110vh) translateX(30px) rotate(300deg); opacity: 0; }
        }
        .petal {
            position: fixed; top: -5vh; font-size: 16px; color: #ff3b3b;
            pointer-events: none; z-index: 0; animation: petalFall linear infinite;
            filter: drop-shadow(0 0 4px rgba(255,50,50,0.6));
        }
        .card { animation: fadeUp 0.8s ease-out both; z-index: 1; }
        .logo-wrap { animation: glowPulse 3.2s ease-in-out infinite; }
        .badge { animation: badgePulse 2.4s ease-in-out infinite; }
        .status-dot.online, .status-dot.offline { animation: dotPulse 1.6s ease-in-out infinite; }
        #qrBox { position: relative; }
        #qrBox::after {
            content: ''; position: absolute; left: 4%; width: 92%; height: 2px;
            background: linear-gradient(90deg, transparent, #ff2b2b, transparent);
            animation: scanLine 2.6s linear infinite; pointer-events: none;
        }
        p, .footer, .status-line { animation: fadeUp 1s ease-out 0.2s both; }
    </style>

</head>
<body>
    <div id="petals"></div>
    <div class="card">
        <div class="logo-wrap"><img src="https://i.ibb.co/PGHm7zDW/file-00000000a29c8211a77f81f71cbcdf06.png" alt="MADUSHANKA MD logo"></div>
        <span class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg>
            100+ COMMANDS
        </span>
        <h2>MADUSHANKA MD</h2>

        <div id="qrPanel">
            <p>Open WhatsApp → Settings → Linked Devices → Link a Device, then scan this QR code</p>
            <div id="qrBox">
                <img id="qrImg" src="" alt="QR code" style="display:none;">
                <div id="qrLoading">Loading QR code...</div>
            </div>
            <span class="hint" id="qrHint" style="display:block;margin-top:10px;">Refreshes automatically every few seconds</span>
        </div>

        <div class="status-line">
            <span class="status-dot" id="statusDot"></span><span id="statusText">Checking status...</span>
        </div>
        <div class="footer">Powered by MADUSHANKA MD — Multi-Device</div>
    </div>
    <script>
        // Lightweight in-browser sound design (no external audio files needed)
        let audioCtx = null;
        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }
        function tone(freq, duration, delay, type, gainPeak) {
            try {
                const ctx = getCtx();
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(gainPeak || 0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration / 1000);
                }, delay || 0);
            } catch (e) {}
        }
        function playClick() { tone(520, 70, 0, 'sine', 0.06); }
        function playSuccess() {
            tone(523, 110, 0, 'triangle', 0.07);
            tone(659, 110, 100, 'triangle', 0.07);
            tone(784, 140, 200, 'triangle', 0.08);
            tone(1046, 220, 340, 'triangle', 0.08);
        }
        function playError() { tone(300, 160, 0, 'sawtooth', 0.05); tone(180, 240, 130, 'sawtooth', 0.05); }

        function iconError() {
            return '<span class="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
        }

        let hasPlayedQrChime = false;
        let hasPlayedConnectChime = false;
        let statusInterval = null;
        async function checkStatus() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                if (data.connected) {
                    dot.className = 'status-dot online';
                    text.innerText = 'Bot Connected';
                    if (statusInterval) { clearInterval(statusInterval); statusInterval = null; }
                    if (!hasPlayedConnectChime) { hasPlayedConnectChime = true; playSuccess(); }
                } else {
                    dot.className = 'status-dot offline';
                    text.innerText = 'Waiting for connection...';
                }
            } catch (e) {
                document.getElementById('statusText').innerText = 'Status unavailable';
            }
        }
        function pollStatus(fast) {
            checkStatus();
            if (statusInterval) clearInterval(statusInterval);
            statusInterval = setInterval(checkStatus, fast ? 3000 : 8000);
        }
        pollStatus(false);

        // ---- QR-only pairing ----
        let qrInterval = null;

        function refreshQR() {
            const img = document.getElementById('qrImg');
            const loading = document.getElementById('qrLoading');
            const hint = document.getElementById('qrHint');
            // Cache-bust so the browser always fetches the latest QR frame
            const testImg = new Image();
            testImg.onload = () => {
                img.src = testImg.src;
                img.style.display = 'block';
                loading.style.display = 'none';
                hint.innerText = 'Refreshes automatically every few seconds';
                hint.style.color = '#d9b9b9';
                if (!hasPlayedQrChime) { hasPlayedQrChime = true; playClick(); }
            };
            testImg.onerror = async () => {
                try {
                    const res = await fetch('/qr');
                    const data = await res.json().catch(() => null);
                    if (data?.error === 'Bot is already connected!') {
                        hint.innerText = '✅ Already connected!';
                        hint.style.color = '#4ade80';
                        if (qrInterval) { clearInterval(qrInterval); qrInterval = null; }
                        return;
                    }
                } catch (e) {}
                loading.innerText = 'Waiting for QR code...';
            };
            testImg.src = '/qr?t=' + Date.now();
        }
        function startQrPolling() {
            refreshQR();
            if (qrInterval) clearInterval(qrInterval);
            qrInterval = setInterval(refreshQR, 5000);
            pollStatus(true);
        }
        // QR is the only pairing method now — start polling immediately.
        startQrPolling();

        // ---- Falling sakura/ember petals ----
        function spawnPetals() {
            const wrap = document.getElementById('petals');
            const symbols = ['🌸', '❁', '✿'];
            const count = window.innerWidth < 500 ? 10 : 16;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('span');
                p.className = 'petal';
                p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.fontSize = (12 + Math.random() * 14) + 'px';
                const duration = 8 + Math.random() * 10;
                p.style.animationDuration = duration + 's';
                p.style.animationDelay = (-Math.random() * duration) + 's';
                wrap.appendChild(p);
            }
        }
        spawnPetals();
    </script>
</body>
</html>
